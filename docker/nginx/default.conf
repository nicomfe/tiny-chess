# Creator links carry a secret token in the query string, so the token is
# stripped before anything is written to the access log.
map $request_uri $logged_request_uri {
    "~^(?<logged_path>[^?]*)\?(.*&)?token=" "$logged_path?token=REDACTED";
    default $request_uri;
}

log_format redacted '$remote_addr - [$time_local] "$request_method $logged_request_uri '
                    '$server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/access.log redacted;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }
}
