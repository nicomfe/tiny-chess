services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-chess}
      DB_USER: ${DB_USER:-chess}
      DB_PASSWORD: ${DB_PASSWORD:-chess}
      APP_SECRET: ${APP_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_EXPOSED_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-chess}
      MYSQL_USER: ${DB_USER:-chess}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chess}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  db-data:
